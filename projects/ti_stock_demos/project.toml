# project.toml: facts about this project, read by `./fw` (contract: docs/specs/fw_project_contract.md).
# Stock (unmodified) TI mmWave SDK 3.6 mmw demos; no TI source is tracked here.

[project]
name = "ti_stock_demos"
summary = "TI's unmodified mmWave SDK 3.6 mmw demos (xwr18xx, xwr68xx) for the IWR1843BOOST and IWR6843ISK, built out of tree"
status = "bench"               # IWR1843 image bench-confirmed (see [[bench]]); IWR6843 never run on a board

[deps]
sdk = "mmwave_sdk"
sdk_version = "03.06.02.00-LTS"
# Compilers come from the SDK's setenv.sh (not the image's 20.2.7.LTS).
toolchain = "ti-cgt-arm 16.9.6.LTS + ti-cgt-c6000 8.3.3 (SDK make, XDC 3.50.08.24, BIOS 6.73.01.01)"
download_items = [2, 9]        # 2 = mmWave SDK 3.6 (and its tools), 9 = UniFlash 9.6.0 (DSLite, IWR1843 flash)

[source]
# TI source built: a path only, nothing is copied into src/ (stock project).
baseline = "mmwave_sdk_03_06_02_00-LTS/packages/ti/demo/xwr{18,68}xx/mmw"
baseline_commit = "n/a (stock, untracked)"

[build]
script = "build.sh"
variants = ["18xx", "68xx"]    # `--variant V` builds one family; no variant builds both
est_minutes = 10

# The first [[artifact]] is the default image. The 6843 .bin is flashable in the contract's sense
# (it has a descriptor and is published) but flash.sh has no headless flasher for it: it prints the
# UniFlash GUI steps and exits 3 (the `manual` method, applied per image by flash.sh).
[[artifact]]
file = "iwr1843_demo.bin"
board = "IWR1843"
descriptor = "demo"
flashable = true

[[artifact]]
file = "iwr1843_demo.elf"
board = "IWR1843"
descriptor = ""
flashable = false

[[artifact]]
file = "iwr6843_demo.bin"
board = "IWR6843"
descriptor = "demo"
flashable = true

[[artifact]]
file = "iwr6843_demo.elf"
board = "IWR6843"
descriptor = ""
flashable = false

[flash]
method = "dslite"              # IWR1843 images; flash.sh prints manual UniFlash GUI steps and exits 3 for the 6843 image
gate = "sop"
port_glob = "/dev/serial/by-id/*-if00"
mode_steps = [
    "The board is in FLASH mode: SOP0 + SOP2 closed (IWR1843BOOST), set with power off.",
    "The board was power-cycled (USB + 5 V) after setting the jumpers; repeat before EVERY attempt.",
    "Nothing else is using the serial port (monitor, driver, ModemManager).",
    "The port is the board's CLI/UART port (XDS110 ...-if00).",
]
after_steps = ["Power off, set functional mode (SOP0 only), power on; then send a cfg at 115200 baud (accepted once per power-up)."]
success_marker = "SUCCESS!! File type META_IMAGE1"
manual_images = ["iwr6843_demo.bin"]   # flash.sh prints UniFlash GUI steps and exits 3; --plan/--dry-run show those steps

[verify]
cli_port_glob = "*-if00"
baud = 115200
descriptor = "demo"

[test]
commands = ["python3 -m unittest discover -s tests"]
cfgs = ["configs/xwr18xx/*.cfg", "configs/xwr68xx/*.cfg"]
bench_doc = "docs/bench_check.md"

# Source: firmware-19 Step 2 (closed directive log, 2026-10-07): DSLite rc=0, `SUCCESS!! File type META_IMAGE1`,
# SOP 001 prompt `mmwDemo:/>` and a `version` reply (xWR18xx, SDK 03.06.02.00). Image sha256 as recorded there.
[[bench]]
board = "IWR1843"
date = "2026-10-07"
sha256 = "cd43e0dfccc8a96a9ffc571ea36a365830eaba7951000892f02078fd2bdac559"
result = "pass"
doc = "docs/bench_check.md"
