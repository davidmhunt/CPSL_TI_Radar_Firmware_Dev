services:
  # Unified interactive firmware development environment
  firmware-env:
    build:
      context: .
      dockerfile: Dockerfile
    image: cpsl-ti-radar-firmware-dev:latest
    volumes:
      # Bind-mount the repository context
      - .:/build_context
    environment:
      - CGT_TI_ARM_CLANG_PATH=/opt/ti/ti-cgt-armllvm_2.1.1.LTS
      - CGT_TI_C6000_PATH=/opt/ti/ti-cgt-c6000_8.3.12
      - CGT_TI_ARM_PATH=/opt/ti/ti-cgt-arm_20.2.7.LTS
      - MMWAVE_MCUPLUS_SDK_PATH=/opt/ti/mmwave_mcuplus_sdk_04_04_00_01
      - MMWAVE_SDK_PATH=/opt/ti/mmwave_sdk_03_06_02_00-LTS
      - SYSCONFIG_PATH=/opt/ti/sysconfig_1.22.0
      - RADAR_TOOLBOX_INSTALL_PATH=/opt/ti/radar_toolbox_4_00_00_05
    stdin_open: true
    tty: true
    command: /bin/bash

  # Flashing / serial bring-up: same image, with the host's serial devices passed through.
  # /dev is bind-mounted (rather than listing devices) so ports that re-enumerate after the
  # EVM is power-cycled stay visible; the cgroup rules allow ttyUSB (188) and ttyACM (166).
  #   ./fw flash awr2243_cascade_ddm /dev/ttyUSB0 prebuilt
  flash:
    extends: firmware-env
    volumes:
      - .:/build_context
      - /dev:/dev
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
    group_add:
      - dialout
