# project.toml: facts about this project, read by `./fw` (contract: docs/specs/fw_project_contract.md).

[project]
name = "iwr1843_sar_lvds"
summary = "IWR1843BOOST SAR / LVDS raw-ADC firmware from the SDK 3.6 xwr18xx mmw demo: MSS-only, CBUFF ADC per chirp over LVDS, per-chirp metadata (dataFmt 2), no TLV/data UART"
status = "bench"               # current image bench-passed 2026-10-10 (see [[bench]]); the reflector tuning runs are still pending

[deps]
sdk = "mmwave_sdk"
sdk_version = "03.06.02.00-LTS"
# Compilers come from the SDK's setenv.sh (not the image's 20.2.7.LTS). MSS-only image:
# no DSP code is built, so the SDK's C6000 compiler is not used.
toolchain = "ti-cgt-arm 16.9.6.LTS (SDK make, XDC 3.50.08.24, BIOS 6.73.01.01)"
download_items = [2, 9]        # 2 = mmWave SDK 3.6, 9 = UniFlash 9.6.0 (DSLite)

[source]
# TI source copied unmodified into src/ (configs/ and tools/ hold the demo's profiles).
baseline = "mmwave_sdk_03_06_02_00-LTS/packages/ti/demo/xwr18xx/mmw"
baseline_commit = "bb3a348"    # firmware_dev commit that added that source unmodified

[build]
script = "build.sh"
variants = []
est_minutes = 10

# The first [[artifact]] is the default image.
[[artifact]]
file = "iwr1843_sar_lvds.bin"
board = "IWR1843"
descriptor = "iwr1843_sar_lvds"
flashable = true

[[artifact]]
file = "iwr1843_sar_lvds.elf"
board = "IWR1843"
descriptor = ""
flashable = false

[flash]
method = "dslite"              # UniFlash 9.6.0 DSLite, configs/iwr1843_uniflash.ccxml
gate = "sop"
port_glob = "/dev/serial/by-id/*-if00"
mode_steps = [
    "The board is in FLASH mode: SOP0 + SOP2 closed (IWR1843BOOST, SOP 101), set with power off.",
    "The board was power-cycled (USB + 5 V) after setting the jumpers; repeat before EVERY attempt, retries included.",
    "Nothing else is using the serial port (monitor, driver, ModemManager).",
    "The port is the board's CLI/UART port (XDS110 ...-if00).",
]
after_steps = ["Power off, set functional mode (SOP0 only), power on; then send a cfg at 115200 baud (accepted once per power-up)."]
success_marker = "SUCCESS!! File type META_IMAGE1"

# Probe set = the descriptor's `identify` block (version, sarStats). The CLI prompt is `mm_sar_lvds:/>`;
# the descriptor, not this table, holds the probes.
[verify]
cli_port_glob = "*-if00"
baud = 115200
descriptor = "iwr1843_sar_lvds"

[test]
# Host tests (tools/test_*.py, 7 files) and the SAR cfg checker over the project's example cfg and the
# parent driver's SAR cfg. Run from this folder; pytest and rootdir come from firmware_dev's pyproject.
commands = [
    "uv run pytest tools -q",
    "python3 tools/sar_cfg_check.py configs/sar_example_2ms.cfg",
    "python3 tools/sar_cfg_check.py ../../../CPSL_TI_Radar_cpp/config/radar/IWR1843/iwr1843_sar_lvds/SAR_2ms_fmt1.cfg",
]
cfgs = [
    "configs/sar_example_2ms.cfg",
    "../../../CPSL_TI_Radar_cpp/config/radar/IWR1843/iwr1843_sar_lvds/SAR_2ms_fmt1.cfg",
]
bench_doc = "docs/bench_check.md"

# Bench records. Sources: docs/RESULTS.md "IWR1843 SAR LVDS firmware ... Set A + 10-min no-reflector soak" and
# docs/firmware.md "Bench status"; image sha256 as recorded there (equals build/iwr1843_sar_lvds.bin).
# Partial: flash (rc=0, boots to `mmwDemo:/>`), the no-reflector runs and the 10-min soak (299,880 chirps, 0 gaps, 0 missing)
# passed on their gates; NOT evaluated, pending the reflector runs: phase continuity, tuned gain/HPF and ADC bits,
# boundary Tb, saturation-vs-gain, I/Q order. The no-reflector runs were measured on this earlier image (prompt
# `mmwDemo:/>`); the current image is recorded in the later [[bench]] entry.
[[bench]]
board = "IWR1843"
date = "2026-10-06"
sha256 = "53948f4d20ca501490dd3d1dbe48229622af5346914dfe33daec33980864267a"
result = "partial"
doc = "docs/bench_bringup.md"

# Current image (prompt `mm_sar_lvds:/>`), IWR1843, 2026-10-10: user flashed from a TTY (SUCCESS), `fw verify` passed
# incl. the `mm_sar_lvds:/>` require, bench_check capture ACCEPTED (chirpAvail 2550, 2549/2550 valid, one tolerated 448 B
# tail hole). The reflector runs (phase continuity, tuning, boundary Tb) remain pending.
[[bench]]
board = "IWR1843"
date = "2026-10-10"
sha256 = "a06ee615b56b12282f2fe9b4a02bb556ceaa81a1b72176e2060cd9209a070924"
result = "pass"
doc = "docs/bench_check.md"
